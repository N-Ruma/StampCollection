{% extends "base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.1/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.3.1/dist/leaflet.js"></script>

<style>
#map {
  height: 80vh;
  width: 100%;
}

/* フォームは画面前面に固定 */
#stamp-form {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 20px;
  border-radius: 8px;
  z-index: 2000;
  display: none;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}
</style>
{% endblock head %}

{% block title %}
<h2>全体マップ</h2>
{% endblock title %}

{% block content %}
<div id="map"></div>

<div id="stamp-form">
  <h3>スタンプを追加</h3>

  <form method="POST" enctype="multipart/form-data"
        action="{% url 'result_add_stamp_pin' %}">
    {% csrf_token %}

    <label>スタンプ名</label><br>
    <input type="text" name="name" required><br><br>

    <input type="hidden" name="latitude" id="latitude">
    <input type="hidden" name="longitude" id="longitude">

    <label>スタンプ画像</label><br>
    <input type="file" name="stamp_image" required><br><br>

    <button type="submit">ここにスタンプを追加</button>
    <button type="button" id="cancel-add">キャンセル</button>
  </form>
</div>
{% endblock content %}

{% block script %}
<script>
const bounds = [
  [42.25, 140.90],
  [42.39, 141.05]
];

const map = L.map('map', {
  minZoom: 13,
  maxZoom: 17,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0
});

map.fitBounds(bounds);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// ============================
// ① 既存スタンプ表示 & 詳細遷移
// ============================
//GPS用追加コード↓
let stampMarkers = [];
{% for stamp in stamps %}
    // マーカー作成
    let marker_{{ stamp }} = L.marker([{{ stamp.latitude }}, {{ stamp.longitude }}]).addTo(map).bindPopup("<b>{{ stamp }}</b>");

    // クリックで詳細ページに移動
    marker_{{ stamp }}.on("click", () => {
        window.location.href = "{% url 'stamp_detail' stamp %}";
    });

    // マウスをピンに被せたとき, ピンの名前を表示
    marker_{{ stamp }}.on("mouseover", () => {
      marker_{{ stamp }}.openPopup();
    })
    marker_{{ stamp }}.on("mouseout", () => {
      marker_{{ stamp }}.closePopup();
    })

    stampMarkers.push({
      name: "{{ stamp }}",
      lat: {{ stamp.latitude }},
      lng: {{ stamp.longitude }},
      marker: marker_{{ stamp }}
    });
{% endfor %}

//HTTPS または localhost でしか動かない
//スマホでは「位置情報の許可」が必須
//ユーザーが拒否すると取得不可
// ============================
// ② 距離計算関数（メートル）
// ============================
function getDistance(lat1, lng1, lat2, lng2) {
  const R = 6371e3;
  const toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad;
  const dLng = (lng2 - lng1) * toRad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * toRad) *
    Math.cos(lat2 * toRad) *
    Math.sin(dLng / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
// ============================
// ③ GPS取得＆スタンプ判定
// ============================
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    function (position) {
      const userLat = position.coords.latitude;
      const userLng = position.coords.longitude;

      // 現在地マーカー
      L.marker([userLat, userLng])
        .addTo(map)
        .bindPopup("現在地")
        .openPopup();

      // 半径50mの円
      L.circle([userLat, userLng], {
        radius: 50,
        color: "blue",
        fillOpacity: 0.2
      }).addTo(map);

      map.setView([userLat, userLng], 16);

      // スタンプとの距離判定
      stampMarkers.forEach(s => {
        const d = getDistance(userLat, userLng, s.lat, s.lng);

        if (d <= 50) {
          s.marker.bindPopup(
            `<b>${s.name}</b><br>スタンプ取得可能！`
          ).openPopup();
        }
      });
    },
    function () {
      alert("位置情報の取得に失敗しました");
    }
  );
} else {
  alert("このブラウザではGPSが使用できません");
}

// 既存スタンプ
{% for stamp in stamps %}
L.marker([{{ stamp.latitude }}, {{ stamp.longitude }}])
  .addTo(map)
  .bindPopup("<b>{{ stamp.name }}</b>")
  .on("click", () => {
    window.location.href = "{% url 'stamp_detail' stamp.name %}";
  });
{% endfor %}

let tempMarker = null;

map.on('click', function(e) {
  const lat = e.latlng.lat;
  const lng = e.latlng.lng;

  if (tempMarker) {
    map.removeLayer(tempMarker);
  }

  tempMarker = L.marker([lat, lng]).addTo(map);

  document.getElementById("latitude").value = lat;
  document.getElementById("longitude").value = lng;
  document.getElementById("stamp-form").style.display = "block";

  // 地図のクリックを一時停止
  map.getContainer().style.pointerEvents = "none";
});

// キャンセル処理
document.getElementById("cancel-add").addEventListener("click", () => {
  if (tempMarker) {
    map.removeLayer(tempMarker);
    tempMarker = null;
  }
  document.getElementById("stamp-form").style.display = "none";
  map.getContainer().style.pointerEvents = "auto";
});
 
// 地図の中心位置を指定
map.setView([42.316, 140.99], 14);
</script>
{% endblock script %}
